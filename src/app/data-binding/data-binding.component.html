<div class="p-4">
    <input type="text" [(ngModel)]="color" (keypress)="keypressevent($event)" (keydown)="blockAandZ($event)">
    <h2 [ngStyle]="{'color':color}">Colors:{{color}}</h2>
</div>

<!-- Notification -->
<div class="col-md-6 mt-3 pe-0">
    <div class="card">
        <div class="dshb-card-title">
            <i class="fas fa-bell cad-icon-1"></i>
            <h4>
                {{ "label.Notification" }}
            </h4>
        </div>

        <div class="dshb-card-Body" style="min-height: 320px">
            <div class="table-responsive">
                <table class="table notifi-table">
                    <tr *ngFor="let item of notificationList">
                        <td class="notifi-prf"><img class="box-image" src="assets/images//user.jpg">
                        </td>
                        <td>{{ item }}</td>
                        <td><button class="notifi-cls"><i class="fas fa-times"></i></button></td>
                    </tr>
                </table>
                <div class="container mt-2">

                    <div class="card notification-card">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">New Notification</h5>
                                <p class="card-text">You have a new message from John Doe. Click to view the details.
                                </p>
                            </div>
                            <div>
                                <i class="fas fa-eye view-btn" data-toggle="tooltip" title="View Notification"></i>
                            </div>
                        </div>
                    </div>


                    <div class="card notification-card">
                        <div class="card-body d-flex justify-content-between align-items-center">
                            <div>
                                <h5 class="card-title">System Update</h5>
                                <p class="card-text">The system will be undergoing maintenance at midnight.</p>
                            </div>
                            <div>
                                <i class="fas fa-eye view-btn" data-toggle="tooltip" title="View Notification"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="date-name">
                    {{ "label.Nonotifications"}}!
                </div>
            </div>
        </div>
    </div>
</div>
