<div class="container">
    <a routerLink="add" class="btn btn-warning">ADD USER</a>
    <a routerLink="/login/" class="btn btn-success">Login</a>
    <input type="search" class="form-control" [formControl]="searchcontrol">
    <table class="table table-bordered">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>City</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let i of array">
          <td>{{ i.name }}</td>
          <td>{{ i.age }}</td>
          <td>{{ i.city }}</td>
        </tr>
      </tbody>
    </table>
  </div>
  <router-outlet></router-outlet>
