<div class="container">
    <form #f="ngForm" (ngSubmit)="submit()">
        <label class="form-label">Name:</label>
        <input type="text" class="form-control" name="name" [(ngModel)]="Obj.name">
        <label class="form-label">Age:</label>
        <input type="text" class="form-control" name="age" [(ngModel)]="Obj.age">
        <label class="form-label">City:</label>
        <input type="text" class="form-control" name="city" [(ngModel)]="Obj.city">
        <input type="submit" class="btn btn-success">
    </form>
</div>
